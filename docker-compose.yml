services:
  dev-db:
    image: postgres:15-alpine
    container_name: buggytasker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buggytasker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buggytasker_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-buggytasker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buggytasker} -d ${POSTGRES_DB:-buggytasker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  web:
    build: ./backend
    container_name: buggytasker_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-buggytasker}:${POSTGRES_PASSWORD:-buggytasker_dev_password}@dev-db:5432/${POSTGRES_DB:-buggytasker}"
    depends_on:
      dev-db:
        condition: service_healthy

volumes:
  postgres_data: